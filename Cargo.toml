[package]
name = "rust-display"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "0.19"
winit = "0.29"
bytemuck = { version = "1.14", features = ["derive"] }
image = "0.25"
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
