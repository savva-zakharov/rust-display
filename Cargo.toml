[package]
name = "rust-display"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "0.19", features = ["webgl"] }
winit = { version = "0.29", features = ["rwh_06"] }
bytemuck = { version = "1.14", features = ["derive"] }
image = { version = "0.25", features = ["png", "jpeg", "exr", "hdr"] }
rfd = "0.15"
tokio = { version = "1", features = ["macros", "rt"] }
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = { version = "0.27", default-features = false, features = ["links", "wayland", "x11"] }
half = "2.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Response", "UrlSearchParams", "Location"] }
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "0.2"
